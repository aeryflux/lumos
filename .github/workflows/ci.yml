name: CI

on:
  push:
    branches: [main, feat/mvp]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build
        env:
          VITE_API_URL: https://api.aeryflux.com
